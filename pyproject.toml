[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "achilles"
version = "0.1.0"
description = "Turn a job description plus your old resume into a tailored, one-page, ATS-clean PDF."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.69,<1.0",
    # Every non-Anthropic provider talks over httpx directly
    # (`achilles/providers/base.py`). It arrives transitively via `anthropic`
    # today, but relying on that means an SDK pin change silently breaks
    # Google, OpenAI, DeepSeek, Groq, xAI, OpenRouter, and GitHub Models.
    "httpx>=0.25,<1.0",
    "typst>=0.13,<1.0",
    "pypdf>=5.1,<7.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
achilles = "achilles.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["achilles"]
artifacts = ["templates/*.typ"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These are data tables, not logic: the keyword ontology and the rubric's verb
# sets / threshold comments read better as wide rows than as wrapped ones.
"achilles/keywords.py" = ["E501"]
"achilles/rubric.py" = ["E501"]
"tests/*" = ["E501"]
# The original single-file prototype, kept verbatim as the reference `scan.py`
# was ported from. Reformatting it would defeat the point of keeping it, so it
# is exempt rather than fixed — and without this, `ruff check .` fails on a
# clean clone over code nobody intends to change.
"scripts/ats_scan.py" = ["E501", "E701", "E702", "I001"]
